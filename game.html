  <style>
    /* 高齡適性視覺與高對比風格 */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background-color: #f1f5f9;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 3D 翻牌視覺 */
    .card-perspective {
      perspective: 1000px;
    }
    
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      cursor: pointer;
    }

    .card-inner.flipped {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.12);
    }

    /* 蓋牌正面 (尊榮高質感深藍) */
    .card-front {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      border: 4px solid #ffffff;
      color: white;
      transform: rotateY(0deg);
    }

    /* 翻開背面 */
    .card-back {
      transform: rotateY(180deg);
      background-color: #ffffff;
    }

    /* 🚨 詐騙陷阱卡 (高對比紅框) */
    .card-problem {
      border: 5px solid #dc2626;
      background-color: #fff5f5;
    }

    /* 🛡️ 智慧防護卡 (高對比綠框) */
    .card-solution {
      border: 5px solid #16a34a;
      background-color: #f0fdf4;
    }

    /* 配對成功（永久保留正面 + 耀眼綠框） */
    .matched-card {
      border-width: 6px !important;
      border-color: #16a34a !important;
      box-shadow: 0 0 25px rgba(22, 163, 74, 0.85) !important;
      cursor: default !important;
    }

    /* 高齡友善大觸控按鈕 */
    .btn-senior {
      min-height: 52px;

    /* 2. 全域狀態 */
    let cardsData = [];           // 當前局別的 6 張卡片數據
    let flippedCards = [];        // 目前翻開比對中的卡片 [{index, data}]
    let matchedIndices = new Set(); // 永久答對保留的索引集合
    let matchedPairs = 0;         // 完成組數 (0 ~ 3)
    let ttsEnabled = true;        // 語音朗讀開關
    let delayTimer = null;        // 配對失敗 5 秒蓋回計時器
    let isProcessingMismatch = false; // 是否處於配對失敗等候狀態

    /* 3. 語音朗讀控制 (Web Speech API) - 僅朗讀核心大字標題 */
    function speakText(text, cancelPrevious = true) {
      if (!ttsEnabled) return;
      if ('speechSynthesis' in window) {
        if (cancelPrevious) {
          window.speechSynthesis.cancel();
        }
        
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-TW';
        utterance.rate = 0.95; // 語速適中偏慢，利於長者聽講
        utterance.pitch = 1.0;
        
        window.speechSynthesis.speak(utterance);
      }
    }

    /* 4. 音效系統 (Web Audio API) */
    
    // 【答對短音效】：雙音階清脆「叮咚♪」（E5 -> C6）
    function playSuccessSound() {
      if (!ttsEnabled) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        // 第一聲：溫和中高音 (E5 - 659.25Hz)
        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(659.25, ctx.currentTime);
        gain1.gain.setValueAtTime(0.35, ctx.currentTime);
        gain1.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.start(ctx.currentTime);
        osc1.stop(ctx.currentTime + 0.22);

        // 第二聲：清脆高音 (C6 - 1046.50Hz)
        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(1046.50, ctx.currentTime + 0.12);
        gain2.gain.setValueAtTime(0.45, ctx.currentTime + 0.12);
        gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.55);
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.start(ctx.currentTime + 0.12);
        osc2.stop(ctx.currentTime + 0.55);
      } catch (e) {
        console.log('AudioContext error:', e);
      }
    }

    // 【通關長音效】：澎湃歡慶勝利樂章 (Victory Fanfare 多音階和弦推進音效)
    function playVictorySound() {
      if (!ttsEnabled) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        // 樂章音符數列：C5 -> E5 -> G5 -> C6 (強音長奏)
        const notes = [
          { freq: 523.25, time: 0.00, duration: 0.14 }, // C5
          { freq: 659.25, time: 0.14, duration: 0.14 }, // E5
          { freq: 783.99, time: 0.28, duration: 0.14 }, // G5
          { freq: 1046.50, time: 0.44, duration: 0.85 } // C6 (長音)
        ];

        notes.forEach(note => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(note.freq, ctx.currentTime + note.time);
          
          gain.gain.setValueAtTime(0.4, ctx.currentTime + note.time);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + note.time + note.duration);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + note.time);
          osc.stop(ctx.currentTime + note.time + note.duration);
        });

        // 為結尾 C6 鋪設豐富的和弦伴音 (E6 1318.51Hz & G6 1567.98Hz)
        const chordNotes = [1318.51, 1567.98];
        chordNotes.forEach(freq => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + 0.44);
          
          gain.gain.setValueAtTime(0.25, ctx.currentTime + 0.44);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.25);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + 0.44);
          osc.stop(ctx.currentTime + 1.25);
        });
      } catch (e) {
        console.log('Victory Audio error:', e);
      }
    }

    function toggleTTS() {
      ttsEnabled = !ttsEnabled;
      const ttsText = document.getElementById('tts-text');
      const ttsIcon = document.getElementById('tts-icon');
      const ttsBtn = document.getElementById('tts-btn');

      if (ttsEnabled) {
        ttsText.innerText = '語音：開啟';
        ttsIcon.className = 'fa-solid fa-volume-high text-xl';
        ttsBtn.className = 'btn-senior bg-amber-400 hover:bg-amber-500 active:scale-95 text-slate-900 font-black text-base sm:text-lg px-4 py-2 rounded-xl flex items-center gap-2 shadow-md';
        speakText("語音朗讀已開啟");
      } else {
        ttsText.innerText = '語音：關閉';
        ttsIcon.className = 'fa-solid fa-volume-xmark text-xl';
        ttsBtn.className = 'btn-senior bg-slate-400 hover:bg-slate-500 active:scale-95 text-white font-black text-base sm:text-lg px-4 py-2 rounded-xl flex items-center gap-2 shadow-md';
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      }
    }

    // 淨化發音內容：只朗讀核心大字標題，自動剝離 Emoji 與前綴標籤
    function speakCardTitle(index) {
      const card = cardsData[index];
      if (!card) return;
      
      let cleanTitle = card.title
        .replace(/[\u{1F300}-\u{1F9FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}🚨🛡️]/gu, '')
        .replace(/^(詐騙陷阱|智慧防護)[:：]?/gi, '')
        .trim();
      
      speakText(cleanTitle);
    }

    /* 5. 遊戲洗牌與開局邏輯 (從 50 題庫隨機抽 3 題) */
    function restartGame() {
      if (delayTimer) {
        clearTimeout(delayTimer);
        delayTimer = null;
      }
      isProcessingMismatch = false;
      document.getElementById('delay-banner').classList.add('hidden');
      
      matchedPairs = 0;
      matchedIndices.clear();
      flippedCards = [];
      document.getElementById('progress-text').innerText = '0';

      cardsData = generateRandom3Pairs();
      renderGrid();

      speakText("防詐終結對對碰，換了新題目，請點擊卡片！");
    }

    function generateRandom3Pairs() {
      const shuffledBank = [...scamBank].sort(() => 0.5 - Math.random());
      const selected = shuffledBank.slice(0, 3);

      let deck = [];
      selected.forEach(item => {
        deck.push({
          pairId: item.id,
          type: 'problem',
          title: item.qTitle,
          desc: item.qDesc,
          icon: item.qIcon
        });
        deck.push({
          pairId: item.id,
          type: 'solution',
          title: item.aTitle,
          desc: item.aDesc,
          icon: item.aIcon
        });
      });

      return deck.sort(() => 0.5 - Math.random());
    }

    function renderGrid() {
      const grid = document.getElementById('cards-grid');
      if (!grid) return;
      grid.innerHTML = '';

      cardsData.forEach((card, index) => {
        const cardElem = document.createElement('div');
        cardElem.className = 'card-perspective h-56 sm:h-64 md:h-72 w-full';
        cardElem.innerHTML = `
          <div id="card-${index}" class="card-inner" onclick="handleCardClick(${index})">
            
            <!-- 卡片正面 (蓋牌狀態) -->
            <div class="card-front p-3 sm:p-4">
              <div class="flex justify-between items-center text-xs sm:text-sm font-black opacity-90">
                <span>防詐演練</span>
                <i class="fa-solid fa-lock text-base"></i>
              </div>
              <div class="my-auto flex flex-col items-center gap-2">
                <div class="w-12 h-12 sm:w-16 sm:h-16 bg-white/20 rounded-full flex items-center justify-center text-3xl sm:text-4xl shadow-inner">
                  <i class="fa-solid fa-shield-cat"></i>
                </div>
                <span class="text-xl sm:text-2xl font-black tracking-wider">翻開卡片</span>
              </div>
              <div class="text-xs sm:text-sm font-extrabold opacity-85">點擊查看內容</div>
            </div>

            <!-- 卡片背面 (翻開狀態) -->
            <div class="card-back ${card.type === 'problem' ? 'card-problem' : 'card-solution'} p-3 sm:p-4">
              
              <!-- 頂部標籤與獨立喇叭播放鈕 -->
              <div class="flex justify-between items-center mb-1">
                <span class="text-xs sm:text-sm font-black px-2.5 py-0.5 rounded-lg ${card.type === 'problem' ? 'bg-red-600 text-white' : 'bg-emerald-600 text-white'}">
                  ${card.type === 'problem' ? '🚨 詐騙陷阱' : '🛡️ 智慧防護'}
                </span>
                
                <button onclick="event.stopPropagation(); speakCardTitle(${index});" class="text-amber-900 bg-amber-200 hover:bg-amber-300 rounded-full w-9 h-9 flex items-center justify-center text-lg shadow active:scale-95" title="播放語音">
                  <i class="fa-solid fa-volume-high"></i>
                </button>
              </div>

              <!-- 大圖標區域 -->
              <div class="my-auto py-1 flex items-center justify-center">
                <i class="fa-solid ${card.icon} text-4xl sm:text-5xl ${card.type === 'problem' ? 'text-red-600' : 'text-emerald-600'}"></i>
              </div>

              <!-- 大字體標題區 (大字 20~24px) -->
              <div class="mt-auto bg-white/95 p-2 rounded-xl border border-slate-100 shadow-sm text-center">
                <h3 class="text-base sm:text-lg md:text-xl font-black text-slate-900 leading-tight mb-1">${card.title}</h3>

    /* 6. 翻牌動作與比對驗證 */
    function handleCardClick(index) {
      if (matchedIndices.has(index) || isProcessingMismatch) {
        return;
      }

      if (flippedCards.length === 1 && flippedCards[0].index === index) {
        return;
      }

      const cardElem = document.getElementById(`card-${index}`);
      if (!cardElem) return;

      cardElem.classList.add('flipped');
      flippedCards.push({ index, data: cardsData[index] });

      // 朗讀核心大標題
      speakCardTitle(index);

      if (flippedCards.length === 2) {
        checkPair();
      }
    }

    function checkPair() {
      const [c1, c2] = flippedCards;

      // 【配對成功】：ID 相符且為問題卡與解答卡組合
      if (c1.data.pairId === c2.data.pairId && c1.data.type !== c2.data.type) {
        // 1. 寫入 matchedIndices 永久保持正面狀態
        matchedIndices.add(c1.index);
        matchedIndices.add(c2.index);

        // 2. 增加進度計數
        matchedPairs++;
        document.getElementById('progress-text').innerText = matchedPairs;

        // 3. 加上綠色耀眼光芒外框
        setTimeout(() => {
          const card1Inner = document.getElementById(`card-${c1.index}`)?.querySelector('.card-back');
          const card2Inner = document.getElementById(`card-${c2.index}`)?.querySelector('.card-back');
          if (card1Inner) card1Inner.classList.add('matched-card');
          if (card2Inner) card2Inner.classList.add('matched-card');
        }, 300);

        // 4. 播放「叮咚♪」清脆短音效
        setTimeout(() => {
          playSuccessSound();
        }, 650);

        flippedCards = [];

        // 全數完成通關
        if (matchedPairs === 3) {
          setTimeout(() => {
            playVictorySound(); // 播放澎湃歡慶勝利樂章
            speakText("太棒了！恭喜您順利通關，榮獲防詐大師勳章！", false);
            document.getElementById('victory-modal').classList.remove('hidden');
          }, 1800);
        }
      } 
      // 【配對失敗】：保留 5 秒供閱讀，並顯示「立刻蓋回卡片」按鈕
      else {
        isProcessingMismatch = true;
        document.getElementById('delay-banner').classList.remove('hidden');

        delayTimer = setTimeout(() => {
          forceFlipBack();
        }, 5000);
      }
    }

    function forceFlipBack() {
      if (delayTimer) {
        clearTimeout(delayTimer);
        delayTimer = null;
      }
      document.getElementById('delay-banner').classList.add('hidden');

      if (flippedCards.length === 2) {
        const [c1, c2] = flippedCards;
        const elem1 = document.getElementById(`card-${c1.index}`);
        const elem2 = document.getElementById(`card-${c2.index}`);
        
        if (elem1 && !matchedIndices.has(c1.index)) elem1.classList.remove('flipped');
        if (elem2 && !matchedIndices.has(c2.index)) elem2.classList.remove('flipped');
        
        flippedCards = [];
      }
      isProcessingMismatch = false;
    }

    function closeVictoryModal() {
      document.getElementById('victory-modal').classList.add('hidden');
    }

    /* 7. 初始化加載 */
    function initApp() {
      restartGame();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
    window.addEventListener('load', initApp);
  </script>
</body>
</html>
